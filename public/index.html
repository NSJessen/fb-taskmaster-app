<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskmaster</title>
  <link rel="stylesheet" href="/stylesheets/style.css">
</head>
<body>
  <main>
    <h1>Taskmaster</h1>

    <form id="task-form">
      <label for="task-input">Ny opgave</label>
      <div class="row">
        <input type="text" id="task-input" name="text" autocomplete="off" required>
        <button type="submit">Tilføj</button>
      </div>
    </form>

    <p id="error-message" class="error" role="alert" hidden></p>

    <ul id="task-list"></ul>
  </main>

  <script type="module" src="/javascripts/app.js"></script>
</body>
</html>
